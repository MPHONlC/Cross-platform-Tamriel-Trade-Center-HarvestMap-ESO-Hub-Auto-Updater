name: "MPHONlC's ESOUI Safe Text"
description: 'Writes upload copies of text files: ESOUI gets Latin-1 (keeps the copyright marks), Bethesda gets UTF-8 (symbols such as © ® ✓ work there) under 10000 characters.'

inputs:
  files:
    description: 'Space-separated files to convert'
    required: true
  out_dir:
    description: 'Folder the converted copies are written to'
    required: false
    default: 'esoui-upload-text'
  target:
    description: 'esoui (Latin-1, the encoding ESOUI reads) or bethesda (UTF-8, 10000-character limit)'
    required: false
    default: 'esoui'

runs:
  using: 'composite'
  steps:
    - name: Write ESOUI-safe copies
      shell: bash
      run: python3 "${{ github.action_path }}/esoui_safe_text.py" --out-dir "${{ inputs.out_dir }}" --target "${{ inputs.target }}" ${{ inputs.files }}
