name: GitHub Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry Run (creates a draft GitHub release, publishes nothing)"
        type: boolean
        default: true
      release_github:
        description: "Release to GitHub"
        type: boolean
        default: false
  workflow_call:
    inputs:
      dry_run:
        description: "Dry Run (creates a draft GitHub release, publishes nothing)"
        type: boolean
        default: true
      release_github:
        description: "Release to GitHub"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/release-gate.yml
    secrets: inherit
    permissions:
      contents: write

  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Decide what this run does
        id: mode
        run: |
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            echo "mode=dry" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.release_github }}" == "true" ]; then
              echo "::notice title=Dry Run Is On::Release to GitHub was checked, but Dry Run is on, so nothing is published."
            fi
          elif [ "${{ inputs.release_github }}" == "true" ]; then
            echo "mode=real" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "::warning title=Nothing To Do::Dry Run is off and Release to GitHub is not checked."
          fi

      - name: Read version
        id: version
        run: |
          VER=$(tr -d ' \r\n' < VERSION)
          echo "Read version: $VER"
          echo "display_version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build the release zip from dist/
        run: |
          PKG="Tamriel Trade Center, HarvestMap, ESO-Hub, ESOUI Auto-Updater"
          mkdir -p "/tmp/build/$PKG"
          cp dist/Linux_Tamriel_Trade_Center.sh dist/macOS_Tamriel_Trade_Center.sh dist/Windows_Tamriel_Trade_Center.bat LICENSE.md "/tmp/build/$PKG/"
          chmod +x "/tmp/build/$PKG/"*.sh
          cd /tmp/build && zip -r -X Tamriel_Trade_Center_Auto-Updater.zip "$PKG"
          echo "zip_file=/tmp/build/Tamriel_Trade_Center_Auto-Updater.zip" >> "$GITHUB_ENV"

      - name: Extract latest changelog entries
        run: |
          awk '/^\[b\]\[COLOR="Orange"\]Version / { if (found) exit; found=1 } found' CHANGELOG_BBCODE.txt > latest_changes_esoui.txt
          awk '/^### Version / { if (found) exit; found=1 } found' CHANGELOG_GFM.txt > latest_changes_github.md
          awk '/^Version: / { if (found) exit; found=1 } found' CHANGELOG.md > latest_changes_plain.md
          cat latest_changes_plain.md

      - name: Create GitHub Release (dry run, draft)
        id: dry_run_step
        if: steps.mode.outputs.mode == 'dry'
        uses: ncipollo/release-action@v1
        with:
          name: Version-${{ steps.version.outputs.display_version }}
          tag: Version-${{ steps.version.outputs.display_version }}
          artifacts: ${{ env.zip_file }}
          artifactContentType: application/zip
          bodyFile: latest_changes_github.md
          allowUpdates: true
          draft: true
          makeLatest: false

      - name: Create GitHub Release
        id: real_step
        if: steps.mode.outputs.mode == 'real'
        uses: ncipollo/release-action@v1
        with:
          name: Version-${{ steps.version.outputs.display_version }}
          tag: Version-${{ steps.version.outputs.display_version }}
          artifacts: ${{ env.zip_file }}
          artifactContentType: application/zip
          bodyFile: latest_changes_github.md
          allowUpdates: true
          draft: false
          makeLatest: true

      - name: Report the result
        if: always() && steps.mode.outputs.mode != 'none'
        run: |
          if [ "${{ steps.mode.outputs.mode }}" == "dry" ]; then STATUS="${{ steps.dry_run_step.outcome }}"; KIND="GitHub Dry Run"; else STATUS="${{ steps.real_step.outcome }}"; KIND="GitHub Release"; fi
          if [ "$STATUS" == "success" ]; then TITLE="$KIND Complete"; DETAIL=""; else TITLE="$KIND Failed"; DETAIL=" Check the release step's log above. A permissions/403 error there usually means this repo's Settings > Actions > General > Workflow permissions is set to read-only. Other causes: tag already exists on a different commit, bad artifact path."; fi
          echo "::notice title=$TITLE::Version ${{ steps.version.outputs.display_version }}.$DETAIL"
          {
            echo "## $TITLE"
            echo ""
            echo "- **Version:** ${{ steps.version.outputs.display_version }}"
            if [ -n "$DETAIL" ]; then echo ""; echo "${DETAIL# }"; fi
            echo ""
            echo "### Changelog"
            echo '```'
            cat latest_changes_plain.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
